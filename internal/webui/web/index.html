<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>feedbackloop — MCP Proxy Log Viewer</title>
  <style>
    /* ===== RESET & BASE ===== */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg-base:        #0d0f12;
      --bg-surface:     #111418;
      --bg-elevated:    #181c23;
      --bg-hover:       #1c2029;
      --bg-active:      #212638;

      --border-subtle:  #191d26;
      --border-muted:   #252b3a;
      --border-focus:   #3d5e8c;

      --text-primary:   #dde2ef;
      --text-secondary: #7e8aa3;
      --text-muted:     #3f4a62;
      --text-code:      #c4ceea;

      --badge-info-bg:    #081825;
      --badge-info-text:  #4a9ecb;
      --badge-info-border:#0e2b3f;

      --badge-error-bg:   #1e0a0a;
      --badge-error-text: #d95555;
      --badge-error-border:#3d1515;

      --dir-in-color:   #2d7a5e;
      --dir-out-color:  #4a6090;

      --green-live:     #22c55e;
      --red-dead:       #ef4444;
      --amber-mid:      #f59e0b;

      --accent-blue:    #3d68a8;
      --accent-blue-lt: #5580c0;

      --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", "Inter",
                   Helvetica, Arial, sans-serif;
      --font-mono: "SF Mono", "JetBrains Mono", "Fira Code", "Cascadia Code",
                   "Consolas", "Menlo", monospace;

      --radius-sm:  3px;
      --radius-md:  5px;
      --radius-lg:  8px;

      --header-h:   54px;
      --tabbar-h:   38px;
      --toolbar-h:  48px;
    }

    html, body {
      height: 100%;
      overflow: hidden;
      background: var(--bg-base);
      color: var(--text-primary);
      font-family: var(--font-sans);
      font-size: 13px;
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    /* ===== APP SHELL ===== */
    .app {
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }

    /* ===== HEADER ===== */
    .header {
      height: var(--header-h);
      min-height: var(--header-h);
      display: flex;
      align-items: center;
      padding: 0 18px;
      background: var(--bg-surface);
      border-bottom: 1px solid var(--border-subtle);
      gap: 14px;
      z-index: 10;
      flex-shrink: 0;
    }

    .logo-mark {
      width: 28px;
      height: 28px;
      border-radius: 7px;
      background: linear-gradient(135deg, #1a2a44 0%, #0f1a2e 100%);
      border: 1px solid #1e3050;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .logo-mark svg { color: #4a9ecb; }

    .header-text { display: flex; flex-direction: column; gap: 1px; }

    .header-name {
      font-size: 14px;
      font-weight: 600;
      letter-spacing: -0.015em;
      color: var(--text-primary);
    }

    .header-desc {
      font-size: 10px;
      color: var(--text-muted);
      font-family: var(--font-mono);
      letter-spacing: 0.02em;
    }

    .header-spacer { flex: 1; }

    /* Connection badge */
    .conn-badge {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      padding: 4px 12px 4px 9px;
      border-radius: 20px;
      font-size: 11.5px;
      font-weight: 500;
      border: 1px solid var(--border-muted);
      background: var(--bg-elevated);
      transition: border-color 0.3s ease, color 0.3s ease;
      user-select: none;
      letter-spacing: 0.01em;
    }

    .conn-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      flex-shrink: 0;
      transition: background 0.3s ease, box-shadow 0.3s ease;
    }

    .conn-badge.s-connected {
      color: var(--green-live);
      border-color: rgba(34, 197, 94, 0.18);
    }
    .conn-badge.s-connected .conn-dot {
      background: var(--green-live);
      box-shadow: 0 0 0 2px rgba(34,197,94,0.2);
    }

    .conn-badge.s-connecting {
      color: var(--amber-mid);
      border-color: rgba(245,158,11,0.18);
    }
    .conn-badge.s-connecting .conn-dot {
      background: var(--amber-mid);
      animation: blink 1.1s ease-in-out infinite;
    }

    .conn-badge.s-disconnected {
      color: var(--red-dead);
      border-color: rgba(239,68,68,0.18);
    }
    .conn-badge.s-disconnected .conn-dot {
      background: var(--red-dead);
    }

    @keyframes blink {
      0%, 100% { opacity: 1; transform: scale(1); }
      50%       { opacity: 0.4; transform: scale(0.8); }
    }

    /* ===== TAB BAR ===== */
    .tabbar {
      height: var(--tabbar-h);
      min-height: var(--tabbar-h);
      display: flex;
      align-items: flex-end;
      padding: 0 14px;
      background: var(--bg-surface);
      border-bottom: 1px solid var(--border-muted);
      flex-shrink: 0;
      z-index: 9;
      gap: 2px;
    }

    .tab-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      height: 30px;
      padding: 0 13px;
      border-radius: var(--radius-md) var(--radius-md) 0 0;
      border: 1px solid transparent;
      border-bottom: none;
      cursor: pointer;
      font-size: 12px;
      font-weight: 500;
      font-family: var(--font-sans);
      background: transparent;
      color: var(--text-secondary);
      outline: none;
      transition: color 0.15s ease, background 0.15s ease, border-color 0.15s ease;
      user-select: none;
      white-space: nowrap;
      position: relative;
      bottom: -1px;
    }

    .tab-btn:hover {
      color: var(--text-primary);
      background: var(--bg-hover);
    }

    .tab-btn.active {
      color: var(--text-primary);
      background: var(--bg-base);
      border-color: var(--border-muted);
      border-bottom-color: var(--bg-base);
    }

    .tab-btn .tab-icon {
      opacity: 0.7;
    }
    .tab-btn.active .tab-icon {
      opacity: 1;
      color: var(--accent-blue-lt);
    }

    /* ===== TOOLBAR ===== */
    .toolbar {
      height: var(--toolbar-h);
      min-height: var(--toolbar-h);
      display: flex;
      align-items: center;
      padding: 0 14px;
      gap: 9px;
      background: var(--bg-surface);
      border-bottom: 1px solid var(--border-subtle);
      flex-shrink: 0;
      z-index: 8;
    }

    .search-wrap {
      position: relative;
      flex: 1;
      max-width: 320px;
    }

    .search-icon {
      position: absolute;
      left: 8px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-muted);
      pointer-events: none;
    }

    .search-input {
      width: 100%;
      height: 30px;
      padding: 0 10px 0 28px;
      background: var(--bg-elevated);
      border: 1px solid var(--border-muted);
      border-radius: var(--radius-md);
      color: var(--text-primary);
      font-family: var(--font-sans);
      font-size: 12px;
      outline: none;
      transition: border-color 0.15s ease, background 0.15s ease;
    }

    .search-input::placeholder { color: var(--text-muted); }
    .search-input:focus {
      border-color: var(--border-focus);
      background: var(--bg-active);
    }

    .kbd-hint {
      position: absolute;
      right: 7px;
      top: 50%;
      transform: translateY(-50%);
      font-size: 10px;
      color: var(--text-muted);
      background: var(--bg-base);
      border: 1px solid var(--border-subtle);
      border-radius: 3px;
      padding: 1px 5px;
      font-family: var(--font-mono);
      pointer-events: none;
      transition: opacity 0.15s ease;
    }

    .search-input:focus + .kbd-hint,
    .search-input:not(:placeholder-shown) + .kbd-hint { opacity: 0; }

    .sep {
      width: 1px;
      height: 20px;
      background: var(--border-muted);
      flex-shrink: 0;
    }

    .level-toggles { display: flex; gap: 4px; }

    .lvl-btn {
      height: 26px;
      padding: 0 9px;
      border-radius: var(--radius-md);
      border: 1px solid transparent;
      cursor: pointer;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      font-family: var(--font-mono);
      background: transparent;
      transition: all 0.15s ease;
      outline: none;
    }

    .lvl-btn.info {
      color: var(--badge-info-text);
      border-color: var(--badge-info-border);
    }
    .lvl-btn.error {
      color: var(--badge-error-text);
      border-color: var(--badge-error-border);
    }
    .lvl-btn.info.on  { background: var(--badge-info-bg); border-color: rgba(74,158,203,0.4); }
    .lvl-btn.error.on { background: var(--badge-error-bg); border-color: rgba(217,85,85,0.4); }
    .lvl-btn:not(.on) { opacity: 0.35; }
    .lvl-btn:hover    { opacity: 1; }

    .right-tools {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-left: auto;
    }

    .tool-btn {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      height: 26px;
      padding: 0 10px;
      border-radius: var(--radius-md);
      border: 1px solid var(--border-muted);
      cursor: pointer;
      font-size: 11.5px;
      font-weight: 500;
      background: var(--bg-elevated);
      color: var(--text-secondary);
      white-space: nowrap;
      outline: none;
      transition: all 0.14s ease;
    }
    .tool-btn:hover {
      background: var(--bg-hover);
      color: var(--text-primary);
      border-color: var(--accent-blue);
    }
    .tool-btn.on {
      color: #6b9fd4;
      border-color: rgba(61,104,168,0.6);
      background: rgba(26,44,72,0.5);
    }

    .count-lbl {
      font-size: 11px;
      color: var(--text-muted);
      font-family: var(--font-mono);
      min-width: 70px;
      text-align: right;
      user-select: none;
      padding-right: 2px;
    }

    /* ===== LOG FEED ===== */
    .feed-wrap {
      flex: 1;
      overflow: hidden;
      position: relative;
      background: var(--bg-base);
    }

    .feed {
      height: 100%;
      overflow-y: auto;
      overflow-x: hidden;
      padding-bottom: 24px;
    }

    .feed::-webkit-scrollbar       { width: 5px; }
    .feed::-webkit-scrollbar-track { background: transparent; }
    .feed::-webkit-scrollbar-thumb {
      background: var(--border-muted);
      border-radius: 3px;
    }
    .feed::-webkit-scrollbar-thumb:hover { background: var(--text-muted); }

    /* ===== EMPTY STATE ===== */
    .empty {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: calc(100% - 40px);
      gap: 14px;
      pointer-events: none;
      animation: fadeup 0.5s ease 0.3s both;
    }

    @keyframes fadeup {
      from { opacity: 0; transform: translateY(6px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .empty-icon { opacity: 0.18; color: var(--text-secondary); }

    .empty-title {
      font-size: 13px;
      font-weight: 500;
      color: var(--text-muted);
    }

    .empty-hint {
      font-size: 11px;
      color: var(--text-muted);
      opacity: 0.55;
      font-family: var(--font-mono);
      text-align: center;
      max-width: 280px;
      line-height: 1.7;
    }

    /* ===== LOG ENTRY ===== */
    .entry {
      display: flex;
      flex-direction: column;
      padding: 0 14px;
      border-bottom: 1px solid var(--border-subtle);
      cursor: pointer;
      transition: background 0.08s ease;
      animation: row-in 0.16s ease-out both;
      will-change: opacity, transform;
    }

    @keyframes row-in {
      from { opacity: 0; transform: translateY(-3px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .entry:hover { background: var(--bg-hover); }
    .entry.x-expanded { background: var(--bg-elevated); }

    /* Top row */
    .entry-row {
      display: flex;
      align-items: center;
      gap: 9px;
      min-height: 42px;
      padding: 3px 0;
    }

    /* Level badge */
    .lvl-tag {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      height: 17px;
      min-width: 36px;
      padding: 0 5px;
      border-radius: 3px;
      font-size: 9.5px;
      font-weight: 700;
      letter-spacing: 0.06em;
      font-family: var(--font-mono);
      flex-shrink: 0;
      border: 1px solid transparent;
    }
    .lvl-tag.info  {
      background: var(--badge-info-bg);
      color: var(--badge-info-text);
      border-color: var(--badge-info-border);
    }
    .lvl-tag.error {
      background: var(--badge-error-bg);
      color: var(--badge-error-text);
      border-color: var(--badge-error-border);
    }

    /* Direction arrow */
    .dir-arrow {
      width: 18px;
      text-align: center;
      font-size: 13px;
      flex-shrink: 0;
      font-weight: 300;
    }
    .dir-arrow.in  { color: var(--dir-in-color); }
    .dir-arrow.out { color: var(--dir-out-color); }
    .dir-arrow.nil { color: transparent; }

    /* Timestamp */
    .ts {
      font-size: 11px;
      font-family: var(--font-mono);
      color: var(--text-muted);
      white-space: nowrap;
      flex-shrink: 0;
      min-width: 54px;
      cursor: default;
    }

    /* Event type */
    .evtype {
      font-family: var(--font-mono);
      font-size: 12px;
      font-weight: 500;
      color: var(--text-primary);
      flex: 1;
      min-width: 0;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      letter-spacing: -0.01em;
    }

    /* Correlation ID chip */
    .cid {
      font-family: var(--font-mono);
      font-size: 10px;
      color: var(--text-muted);
      flex-shrink: 0;
      white-space: nowrap;
      background: var(--bg-elevated);
      padding: 1px 5px;
      border-radius: var(--radius-sm);
      border: 1px solid var(--border-subtle);
      letter-spacing: 0.03em;
    }

    /* Expand indicator */
    .expand-tip {
      font-size: 10px;
      color: var(--text-muted);
      flex-shrink: 0;
      opacity: 0;
      transition: opacity 0.12s ease;
      user-select: none;
      font-family: var(--font-mono);
      width: 12px;
      text-align: center;
    }
    .entry:hover .expand-tip { opacity: 0.6; }
    .entry.x-expanded .expand-tip { opacity: 1; color: var(--accent-blue-lt); }

    /* Body */
    .entry-body {
      display: none;
      padding: 2px 0 11px 0;
    }
    .entry.x-expanded .entry-body { display: block; }

    .json-block {
      background: #080a0e;
      border: 1px solid var(--border-muted);
      border-radius: var(--radius-md);
      padding: 10px 13px;
      font-family: var(--font-mono);
      font-size: 11.5px;
      line-height: 1.7;
      color: var(--text-code);
      overflow-x: auto;
      white-space: pre;
      cursor: default;
    }

    /* JSON syntax colors */
    .jk  { color: #6dbee8; }   /* key   */
    .js  { color: #7ec894; }   /* string */
    .jn  { color: #d4a76a; }   /* number */
    .jb  { color: #b07fd4; }   /* bool  */
    .jz  { color: #b07fd4; }   /* null  */
    .jp  { color: #4a5568; }   /* punctuation */

    /* ===== SCROLL-TO-BOTTOM BUTTON ===== */
    .scroll-fab {
      position: absolute;
      bottom: 24px;
      right: 18px;
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: var(--accent-blue);
      border: 1px solid rgba(255,255,255,0.1);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 14px rgba(0,0,0,0.6);
      opacity: 0;
      transform: translateY(8px) scale(0.92);
      transition: opacity 0.2s ease, transform 0.2s ease, background 0.15s ease;
      z-index: 20;
      outline: none;
    }
    .scroll-fab.show {
      opacity: 1;
      transform: translateY(0) scale(1);
    }
    .scroll-fab:hover { background: var(--accent-blue-lt); }

    /* ===== FILTERED ===== */
    .entry.hidden { display: none; }

    /* ===== TOOL EXPLORER ===== */
    .tools-panel {
      display: none;
      flex-direction: column;
      flex: 1;
      overflow: hidden;
      background: var(--bg-base);
    }
    .tools-panel.active {
      display: flex;
    }

    /* Tools toolbar */
    .tools-toolbar {
      height: var(--toolbar-h);
      min-height: var(--toolbar-h);
      display: flex;
      align-items: center;
      padding: 0 14px;
      gap: 9px;
      background: var(--bg-surface);
      border-bottom: 1px solid var(--border-subtle);
      flex-shrink: 0;
    }

    .tools-toolbar .search-wrap {
      max-width: 360px;
    }

    .tools-count-lbl {
      font-size: 11px;
      color: var(--text-muted);
      font-family: var(--font-mono);
      margin-left: auto;
      user-select: none;
      padding-right: 2px;
      white-space: nowrap;
    }

    /* Tools scroll area */
    .tools-scroll {
      flex: 1;
      overflow-y: auto;
      overflow-x: hidden;
      padding: 16px 14px 32px 14px;
    }

    .tools-scroll::-webkit-scrollbar       { width: 5px; }
    .tools-scroll::-webkit-scrollbar-track { background: transparent; }
    .tools-scroll::-webkit-scrollbar-thumb {
      background: var(--border-muted);
      border-radius: 3px;
    }
    .tools-scroll::-webkit-scrollbar-thumb:hover { background: var(--text-muted); }

    /* Tools grid */
    .tools-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
      gap: 10px;
    }

    /* Tool card */
    .tool-card {
      background: var(--bg-surface);
      border: 1px solid var(--border-muted);
      border-radius: var(--radius-lg);
      padding: 14px 16px 12px 16px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      transition: border-color 0.15s ease, background 0.15s ease;
    }
    .tool-card:hover {
      border-color: var(--accent-blue);
      background: var(--bg-elevated);
    }

    /* Card header row */
    .tool-card-header {
      display: flex;
      align-items: flex-start;
      gap: 8px;
      flex-wrap: wrap;
    }

    .tool-card-name {
      font-family: var(--font-mono);
      font-size: 12.5px;
      font-weight: 600;
      color: var(--text-primary);
      letter-spacing: -0.01em;
      flex-shrink: 0;
    }

    .tool-card-title {
      font-size: 11.5px;
      color: var(--text-secondary);
      font-weight: 400;
      align-self: center;
      min-width: 0;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .tool-card-badges {
      display: flex;
      gap: 4px;
      flex-wrap: wrap;
      margin-left: auto;
    }

    /* Annotation badges */
    .ann-badge {
      display: inline-flex;
      align-items: center;
      height: 16px;
      padding: 0 6px;
      border-radius: 3px;
      font-size: 9px;
      font-weight: 700;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      font-family: var(--font-mono);
      border: 1px solid transparent;
      white-space: nowrap;
    }

    .ann-badge.readonly {
      background: rgba(34,197,94,0.08);
      color: #4ade80;
      border-color: rgba(34,197,94,0.2);
    }
    .ann-badge.destructive {
      background: rgba(239,68,68,0.09);
      color: #f87171;
      border-color: rgba(239,68,68,0.22);
    }
    .ann-badge.idempotent {
      background: rgba(61,104,168,0.12);
      color: #7aa8d8;
      border-color: rgba(61,104,168,0.28);
    }
    .ann-badge.openworld {
      background: rgba(168,85,247,0.09);
      color: #c084fc;
      border-color: rgba(168,85,247,0.22);
    }

    /* Card description */
    .tool-card-desc {
      font-size: 12px;
      color: var(--text-secondary);
      line-height: 1.6;
    }

    /* Schema section */
    .schema-section {
      display: flex;
      flex-direction: column;
      gap: 0;
      border-top: 1px solid var(--border-subtle);
      padding-top: 8px;
      margin-top: 2px;
    }

    .schema-toggle {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      cursor: pointer;
      font-size: 11px;
      font-family: var(--font-mono);
      color: var(--text-muted);
      background: none;
      border: none;
      outline: none;
      padding: 0;
      user-select: none;
      transition: color 0.12s ease;
      text-align: left;
    }
    .schema-toggle:hover { color: var(--text-secondary); }
    .schema-toggle.open  { color: var(--accent-blue-lt); }

    .schema-arrow {
      font-size: 9px;
      display: inline-block;
      transition: transform 0.15s ease;
    }
    .schema-toggle.open .schema-arrow {
      transform: rotate(90deg);
    }

    .schema-body {
      display: none;
      margin-top: 7px;
    }
    .schema-body.open {
      display: block;
    }

    /* Tools empty / loading state */
    .tools-empty {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100%;
      gap: 16px;
      pointer-events: none;
      animation: fadeup 0.4s ease 0.1s both;
    }

    .tools-empty-icon {
      opacity: 0.15;
      color: var(--text-secondary);
    }

    .tools-empty-title {
      font-size: 13px;
      font-weight: 500;
      color: var(--text-muted);
    }

    .tools-empty-hint {
      font-size: 11px;
      color: var(--text-muted);
      opacity: 0.5;
      font-family: var(--font-mono);
      text-align: center;
      max-width: 260px;
      line-height: 1.7;
    }

    /* Pulsing waiting indicator */
    .tools-pulse {
      display: flex;
      gap: 5px;
      align-items: center;
    }
    .tools-pulse span {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--accent-blue);
      animation: pulse-dot 1.4s ease-in-out infinite;
    }
    .tools-pulse span:nth-child(2) { animation-delay: 0.2s; }
    .tools-pulse span:nth-child(3) { animation-delay: 0.4s; }

    @keyframes pulse-dot {
      0%, 80%, 100% { opacity: 0.2; transform: scale(0.85); }
      40%            { opacity: 1;   transform: scale(1); }
    }

    /* Tools error state */
    .tools-error {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100%;
      gap: 10px;
      animation: fadeup 0.3s ease both;
    }
    .tools-error-msg {
      font-size: 12px;
      color: var(--badge-error-text);
      font-family: var(--font-mono);
    }

    /* Hidden utility for tab switching */
    .view-hidden { display: none !important; }

    /* ===== ANALYSIS VIEW ===== */
    .analysis-panel { flex:1; display:none; flex-direction:column; overflow:hidden; }
    .analysis-panel.active { display:flex; }

    .analysis-toolbar {
      height: var(--toolbar-h); min-height: var(--toolbar-h);
      display: flex; align-items: center; padding: 0 16px; gap: 10px;
      background: var(--bg-surface); border-bottom: 1px solid var(--border-subtle); flex-shrink: 0;
    }
    .btn-run-analysis {
      display: inline-flex; align-items: center; gap: 6px; height: 28px; padding: 0 14px;
      background: var(--accent-blue); color: #fff; border: none;
      border-radius: var(--radius-md); font-size: 12px; font-weight: 500;
      cursor: pointer; transition: background 0.15s; font-family: var(--font-sans);
    }
    .btn-run-analysis:hover { background: var(--accent-blue-lt); }
    .btn-run-analysis:disabled { opacity: 0.5; cursor: not-allowed; }
    .btn-save-report {
      display: inline-flex; align-items: center; gap: 5px; height: 28px; padding: 0 12px;
      background: transparent; color: var(--text-secondary); border: 1px solid var(--border-muted);
      border-radius: var(--radius-md); font-size: 12px; cursor: pointer;
      transition: all 0.15s; font-family: var(--font-sans);
    }
    .btn-save-report:hover { color: var(--text-primary); border-color: var(--text-muted); }
    .btn-save-report:disabled { opacity: 0.4; cursor: not-allowed; }
    .analysis-status-text { font-size: 12px; color: var(--text-muted); flex: 1; }

    .analysis-scroll {
      flex: 1; overflow-y: auto; padding: 24px;
      scrollbar-width: thin; scrollbar-color: var(--border-muted) transparent;
    }
    .analysis-scroll::-webkit-scrollbar { width: 6px; }
    .analysis-scroll::-webkit-scrollbar-track { background: transparent; }
    .analysis-scroll::-webkit-scrollbar-thumb { background: var(--border-muted); border-radius: 3px; }

    /* States */
    .an-center {
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 16px; min-height: 300px; text-align: center; color: var(--text-secondary);
    }
    .an-center-icon { color: var(--text-muted); }
    .an-center-title { font-size: 16px; font-weight: 600; color: var(--text-primary); }
    .an-center-body { font-size: 13px; max-width: 420px; line-height: 1.6; }
    .an-code-hint {
      font-family: var(--font-mono); font-size: 12px; background: var(--bg-elevated);
      border: 1px solid var(--border-muted); border-radius: var(--radius-md);
      padding: 10px 16px; color: var(--text-code);
    }
    .an-spinner {
      width: 36px; height: 36px; border: 3px solid var(--border-muted);
      border-top-color: var(--accent-blue); border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .an-error-card {
      background: var(--badge-error-bg); border: 1px solid var(--badge-error-border);
      border-radius: var(--radius-lg); padding: 20px 24px; max-width: 520px; margin: 0 auto;
    }
    .an-error-card .an-center-title { color: var(--badge-error-text); }

    /* Report */
    .an-report { display: flex; flex-direction: column; gap: 24px; max-width: 900px; }
    .an-stats-row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }
    .an-stat-card {
      background: var(--bg-surface); border: 1px solid var(--border-muted);
      border-radius: var(--radius-lg); padding: 16px 18px;
    }
    .an-stat-num { font-family: var(--font-mono); font-size: 26px; font-weight: 600; color: var(--text-primary); line-height: 1; }
    .an-stat-lbl { font-size: 11px; color: var(--text-secondary); margin-top: 6px; text-transform: uppercase; letter-spacing: 0.04em; }

    .an-summary-card {
      background: var(--bg-surface); border: 1px solid var(--border-muted);
      border-radius: var(--radius-lg); padding: 20px 24px;
    }
    .an-summary-label { font-size: 10px; font-weight: 600; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: 10px; }
    .an-summary-text { font-size: 14px; line-height: 1.7; color: var(--text-primary); }
    .an-summary-meta { font-size: 11px; color: var(--text-muted); margin-top: 14px; font-family: var(--font-mono); }

    .an-recs-header { display: flex; align-items: center; gap: 12px; margin-bottom: 4px; }
    .an-recs-title { font-size: 15px; font-weight: 600; color: var(--text-primary); }
    .an-recs-badge {
      font-size: 11px; font-weight: 600; background: var(--bg-elevated);
      color: var(--text-secondary); border: 1px solid var(--border-muted);
      border-radius: 12px; padding: 2px 8px;
    }
    .an-filters { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 16px; }
    .an-filter-chip {
      height: 24px; padding: 0 10px; border-radius: 12px; font-size: 11px; font-weight: 500;
      cursor: pointer; border: 1px solid var(--border-muted); background: transparent;
      color: var(--text-secondary); transition: all 0.15s; font-family: var(--font-sans);
    }
    .an-filter-chip.on { background: var(--bg-elevated); border-color: var(--accent-blue); color: var(--text-primary); }
    .an-filter-sep { width: 1px; background: var(--border-muted); margin: 0 2px; }

    /* Rec card */
    .rec-card {
      background: var(--bg-surface); border: 1px solid var(--border-muted);
      border-left-width: 4px; border-radius: var(--radius-lg); overflow: hidden;
      cursor: pointer; margin-bottom: 10px; transition: border-color 0.15s;
    }
    .rec-card:hover { border-color: var(--border-focus); }
    .rec-card.pri-high   { border-left-color: #c0392b; }
    .rec-card.pri-medium { border-left-color: #d4871a; }
    .rec-card.pri-low    { border-left-color: #3d68a8; }
    .rec-header { display: flex; align-items: center; gap: 8px; padding: 14px 16px; }
    .rec-priority {
      font-size: 10px; font-weight: 700; letter-spacing: 0.06em;
      padding: 2px 7px; border-radius: var(--radius-sm); text-transform: uppercase;
    }
    .rec-priority.high   { background:#2d0e0e; color:#e05555; border:1px solid #5a1515; }
    .rec-priority.medium { background:#271a05; color:#d4871a; border:1px solid #4a2f08; }
    .rec-priority.low    { background:#081825; color:#4a9ecb; border:1px solid #0e2b3f; }
    .rec-category {
      font-size: 10px; font-weight: 600; padding: 2px 7px;
      border-radius: var(--radius-sm); text-transform: uppercase; letter-spacing: 0.04em;
    }
    .cat-description   { background:#091818; color:#3a9e9e; border:1px solid #0d2b2b; }
    .cat-parameter     { background:#120918; color:#9e5ecb; border:1px solid #2a1040; }
    .cat-new_tool      { background:#091811; color:#3daa6a; border:1px solid #0d2e1a; }
    .cat-performance   { background:#191008; color:#c87d30; border:1px solid #3a2208; }
    .cat-error_pattern { background:#1e0a0a; color:#d95555; border:1px solid #3d1515; }
    .rec-tool-name { font-family: var(--font-mono); font-size: 11px; color: var(--text-muted); }
    .rec-expand-arrow { margin-left: auto; color: var(--text-muted); transition: transform 0.2s; }
    .rec-card.expanded .rec-expand-arrow { transform: rotate(90deg); }
    .rec-title { font-size: 13px; font-weight: 600; color: var(--text-primary); padding: 0 16px 14px; line-height: 1.4; }
    .rec-body { display: none; border-top: 1px solid var(--border-subtle); padding: 16px; }
    .rec-card.expanded .rec-body { display: block; }
    .rec-section { margin-bottom: 16px; }
    .rec-section:last-child { margin-bottom: 0; }
    .rec-section-label { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em; color: var(--text-muted); margin-bottom: 6px; }
    .rec-section-text { font-size: 13px; line-height: 1.6; color: var(--text-secondary); }
    .rec-evidence-list { list-style: none; }
    .rec-evidence-list li { font-size: 12px; color: var(--text-secondary); padding: 3px 0 3px 16px; position: relative; line-height: 1.5; }
    .rec-evidence-list li::before { content: '→'; position: absolute; left: 0; color: var(--text-muted); }
    .rec-diff { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .rec-diff-label { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 6px; }
    .rec-diff-before .rec-diff-label { color: #d95555; }
    .rec-diff-after  .rec-diff-label { color: #3daa6a; }
    .rec-diff-text {
      font-family: var(--font-mono); font-size: 11px; line-height: 1.6;
      padding: 10px 12px; border-radius: var(--radius-md);
      overflow-x: auto; white-space: pre-wrap; word-break: break-word;
    }
    .rec-diff-before .rec-diff-text { background:#1e0a0a; color:#d9a0a0; border:1px solid #3d1515; }
    .rec-diff-after  .rec-diff-text { background:#091811; color:#7ec8a0; border:1px solid #0d2e1a; }
  </style>
</head>
<body>
<div class="app">

  <!-- HEADER -->
  <header class="header">
    <div class="logo-mark">
      <svg width="14" height="14" viewBox="0 0 14 14" fill="none">
        <path d="M2 7 C2 4.24 4.24 2 7 2" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
        <path d="M12 7 C12 9.76 9.76 12 7 12" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
        <circle cx="7" cy="7" r="1.8" fill="currentColor"/>
        <path d="M7 2 L8.5 3.5" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/>
        <path d="M7 12 L5.5 10.5" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/>
      </svg>
    </div>
    <div class="header-text">
      <span class="header-name">feedbackloop</span>
      <span class="header-desc">MCP Proxy Log Viewer</span>
    </div>
    <div class="header-spacer"></div>
    <div class="conn-badge s-connecting" id="connBadge">
      <div class="conn-dot"></div>
      <span id="connLabel">Connecting</span>
    </div>
  </header>

  <!-- TAB BAR -->
  <div class="tabbar">
    <button class="tab-btn active" id="tabLog" data-tab="log">
      <svg class="tab-icon" width="12" height="12" viewBox="0 0 12 12" fill="none">
        <rect x="1.5" y="2" width="9" height="8" rx="1.5" stroke="currentColor" stroke-width="1.2"/>
        <path d="M3.5 5 h5 M3.5 7 h3" stroke="currentColor" stroke-width="1.1" stroke-linecap="round"/>
      </svg>
      Log
    </button>
    <button class="tab-btn" id="tabTools" data-tab="tools">
      <svg class="tab-icon" width="12" height="12" viewBox="0 0 12 12" fill="none">
        <path d="M2 9.5 L4.5 7 M7.5 2 L10 4.5 L8 6.5 L5.5 4 Z" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M4.5 7 L5.5 4" stroke="currentColor" stroke-width="1.1" stroke-linecap="round"/>
      </svg>
      Tools
    </button>
    <button class="tab-btn" id="tabAnalysis" data-tab="analysis">
      <svg class="tab-icon" width="12" height="12" viewBox="0 0 12 12" fill="none">
        <circle cx="6" cy="6" r="4.5" stroke="currentColor" stroke-width="1.2"/>
        <path d="M6 3.5 v2.5 l1.5 1.5" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M4 9.5 L8 9.5" stroke="currentColor" stroke-width="1.1" stroke-linecap="round"/>
      </svg>
      Analysis
    </button>
  </div>

  <!-- LOG VIEW (toolbar + feed) -->
  <div id="logView" style="display:contents;">

    <!-- TOOLBAR -->
    <div class="toolbar">

      <div class="search-wrap">
        <svg class="search-icon" width="12" height="12" viewBox="0 0 12 12" fill="none">
          <circle cx="5.2" cy="5.2" r="3.8" stroke="currentColor" stroke-width="1.3"/>
          <path d="M8 8 L11 11" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/>
        </svg>
        <input
          id="searchInput"
          class="search-input"
          type="text"
          placeholder="Filter event_type, level, message..."
          autocomplete="off"
          spellcheck="false"
        />
        <span class="kbd-hint">/</span>
      </div>

      <div class="sep"></div>

      <div class="level-toggles">
        <button class="lvl-btn info on"  data-level="info"  title="Toggle INFO entries">INFO</button>
        <button class="lvl-btn error on" data-level="error" title="Toggle ERROR entries">ERROR</button>
      </div>

      <div class="sep"></div>

      <div class="right-tools">
        <button class="tool-btn on" id="autoScrollBtn" title="Toggle auto-scroll (follows latest entry)">
          <svg width="11" height="11" viewBox="0 0 11 11" fill="none">
            <path d="M5.5 1 v7 M2.5 6 L5.5 9 L8.5 6" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
          Auto-scroll
        </button>
        <button class="tool-btn" id="clearBtn" title="Clear all log entries">
          <svg width="11" height="11" viewBox="0 0 11 11" fill="none">
            <path d="M2 2.5 h7 M4.5 2.5 V1.5 h2 v1 M4 2.5 l.4 5.5 h2.2 l.4-5.5" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
          Clear
        </button>
        <span class="count-lbl" id="countLbl">0 entries</span>
      </div>

    </div>

    <!-- FEED -->
    <div class="feed-wrap">
      <div class="feed" id="feed">
        <div class="empty" id="emptyState">
          <svg class="empty-icon" width="44" height="44" viewBox="0 0 44 44" fill="none">
            <rect x="5" y="10" width="34" height="26" rx="4" stroke="currentColor" stroke-width="1.5"/>
            <path d="M12 18 h20 M12 22 h14 M12 26 h10" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/>
            <circle cx="36" cy="12" r="6" fill="var(--bg-base)" stroke="currentColor" stroke-width="1.3"/>
            <path d="M36 9.5 v2.5 l1.8 1.8" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
          <div class="empty-title">Waiting for log entries</div>
          <div class="empty-hint">Connect an MCP client to start seeing traffic logged here in real time.</div>
        </div>
      </div>

      <button class="scroll-fab" id="scrollFab" title="Jump to latest">
        <svg width="13" height="13" viewBox="0 0 13 13" fill="none">
          <path d="M6.5 2 v8 M3 7.5 L6.5 11 L10 7.5"
                stroke="white" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </button>
    </div>

  </div><!-- #logView -->

  <!-- TOOLS VIEW -->
  <div class="tools-panel" id="toolsView">

    <!-- Tools toolbar -->
    <div class="tools-toolbar">
      <div class="search-wrap">
        <svg class="search-icon" width="12" height="12" viewBox="0 0 12 12" fill="none">
          <circle cx="5.2" cy="5.2" r="3.8" stroke="currentColor" stroke-width="1.3"/>
          <path d="M8 8 L11 11" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/>
        </svg>
        <input
          id="toolsSearchInput"
          class="search-input"
          type="text"
          placeholder="Search tools by name or description..."
          autocomplete="off"
          spellcheck="false"
        />
      </div>
      <span class="tools-count-lbl" id="toolsCountLbl"></span>
    </div>

    <!-- Tools scroll / grid area -->
    <div class="tools-scroll" id="toolsScroll">
      <!-- content rendered by JS -->
    </div>

  </div><!-- #toolsView -->

  <!-- ANALYSIS VIEW -->
  <div class="analysis-panel" id="analysisView">

    <div class="analysis-toolbar">
      <button class="btn-run-analysis" id="runAnalysisBtn">
        <svg width="11" height="11" viewBox="0 0 11 11" fill="none">
          <circle cx="5.5" cy="5.5" r="4.5" stroke="currentColor" stroke-width="1.2"/>
          <path d="M4 3.5 L4 7.5 L8 5.5 Z" fill="currentColor"/>
        </svg>
        Run Analysis
      </button>
      <span class="analysis-status-text" id="analysisStatusText">Loading…</span>
      <button class="btn-save-report" id="saveReportBtn" disabled>
        <svg width="11" height="11" viewBox="0 0 11 11" fill="none">
          <path d="M2 8.5 h7 M5.5 1.5 v5 M3 5 l2.5 2.5 L8 5" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        Save Report
      </button>
    </div>

    <div class="analysis-scroll" id="analysisScroll">
      <!-- rendered by JS -->
    </div>

  </div><!-- #analysisView -->

</div><!-- .app -->

<script>
(function () {
  'use strict';

  /* ===== CONFIG ===== */
  var MAX   = 500;
  var SSE_URL = '/events';
  var BO_MIN  = 600;
  var BO_MAX  = 32000;
  var BO_MUL  = 1.65;

  /* ===== STATE ===== */
  var entries    = [];       // LogEntry objects, capped at MAX
  var elMap      = {};       // id -> DOM element
  var idSeq      = 0;
  var autoScroll = true;
  var filterTxt  = '';
  var lvlOn      = { info: true, error: true };
  var pending    = [];
  var rafQueued  = false;
  var sse        = null;
  var boDelay    = BO_MIN;
  var reTimer    = null;

  // Tool Explorer state
  var allTools       = [];   // raw tool objects from /api/tools
  var toolsFilterTxt = '';
  var activeTab      = 'log';

  /* ===== DOM ===== */
  var feed        = document.getElementById('feed');
  var emptyState  = document.getElementById('emptyState');
  var connBadge   = document.getElementById('connBadge');
  var connLabel   = document.getElementById('connLabel');
  var searchInput = document.getElementById('searchInput');
  var autoScrollBtn = document.getElementById('autoScrollBtn');
  var clearBtn    = document.getElementById('clearBtn');
  var countLbl    = document.getElementById('countLbl');
  var scrollFab   = document.getElementById('scrollFab');
  var lvlBtns     = document.querySelectorAll('.lvl-btn');

  var tabLog      = document.getElementById('tabLog');
  var tabTools    = document.getElementById('tabTools');
  var tabAnalysis = document.getElementById('tabAnalysis');
  var logView     = document.getElementById('logView');
  var toolsView   = document.getElementById('toolsView');
  var analysisView= document.getElementById('analysisView');
  var analysisScroll = document.getElementById('analysisScroll');
  var runAnalysisBtn = document.getElementById('runAnalysisBtn');
  var saveReportBtn  = document.getElementById('saveReportBtn');
  var analysisStatusText = document.getElementById('analysisStatusText');
  var toolsScroll = document.getElementById('toolsScroll');
  var toolsSearchInput = document.getElementById('toolsSearchInput');
  var toolsCountLbl    = document.getElementById('toolsCountLbl');

  var currentReport = null;
  var analysisPollTimer = null;
  var anCatFilter = 'all';
  var anPriFilter = 'all';

  /* ===== STATUS ===== */
  function setStatus(cls, label) {
    connBadge.className = 'conn-badge ' + cls;
    connLabel.textContent = label;
  }

  /* ===== SSE ===== */
  function connect() {
    if (sse) { try { sse.close(); } catch (_) {} sse = null; }
    setStatus('s-connecting', 'Connecting');

    try {
      sse = new EventSource(SSE_URL);
    } catch (e) {
      scheduleReconnect();
      return;
    }

    sse.addEventListener('open', function () {
      boDelay = BO_MIN;
      setStatus('s-connected', 'Connected');
    });

    sse.addEventListener('connected', function () {
      boDelay = BO_MIN;
      setStatus('s-connected', 'Connected');
    });

    sse.addEventListener('log', function (ev) {
      boDelay = BO_MIN;
      try {
        var entry = JSON.parse(ev.data);
        enqueue(entry);
        if (entry.event_type === 'tool_catalog') { loadTools(); }
        if (entry.event_type === 'analysis_complete' || entry.event_type === 'analysis_error') {
          stopAnalysisPoll();
          loadAnalysis();
        }
      } catch (e) {
        console.warn('[feedbackloop] bad log entry:', e);
      }
    });

    sse.addEventListener('error', function () {
      try { sse.close(); } catch (_) {}
      sse = null;
      setStatus('s-disconnected', 'Disconnected');
      scheduleReconnect();
    });
  }

  function scheduleReconnect() {
    if (reTimer) return;
    var delay = Math.min(boDelay, BO_MAX);
    boDelay = Math.ceil(boDelay * BO_MUL);
    var secs = (delay / 1000).toFixed(1).replace(/\.0$/, '');
    setStatus('s-connecting', 'Retry in ' + secs + 's');
    reTimer = setTimeout(function () { reTimer = null; connect(); }, delay);
  }

  /* ===== ENTRY PIPELINE ===== */
  function enqueue(raw) {
    var id = ++idSeq;
    raw._id = id;
    raw._tsDate = new Date(raw.timestamp);

    entries.push(raw);

    // Evict oldest when over cap
    if (entries.length > MAX) {
      var evicted = entries.shift();
      var evEl = elMap[evicted._id];
      if (evEl) { evEl.parentNode && evEl.parentNode.removeChild(evEl); delete elMap[evicted._id]; }
    }

    pending.push(raw);

    if (!rafQueued) {
      rafQueued = true;
      requestAnimationFrame(flush);
    }
  }

  function flush() {
    rafQueued = false;
    var batch = pending.splice(0);
    if (!batch.length) return;

    // Remove empty state placeholder on first real entry
    if (emptyState.parentNode) emptyState.parentNode.removeChild(emptyState);

    var frag = document.createDocumentFragment();
    for (var i = 0; i < batch.length; i++) {
      var entry = batch[i];
      var el = buildEl(entry);
      elMap[entry._id] = el;
      applyFilter(el, entry);
      frag.appendChild(el);
    }

    feed.appendChild(frag);
    refreshCount();

    if (autoScroll) {
      jumpToBottom();
    } else {
      refreshFab();
    }
  }

  /* ===== BUILD ELEMENT ===== */
  function buildEl(entry) {
    var el = document.createElement('div');
    el.className = 'entry';

    var level = entry.level || 'info';
    var dir   = entry.direction || '';

    // ---- row ----
    var row = document.createElement('div');
    row.className = 'entry-row';

    // level badge
    var lvlTag = document.createElement('span');
    lvlTag.className = 'lvl-tag ' + level;
    lvlTag.textContent = level.toUpperCase();
    row.appendChild(lvlTag);

    // direction arrow
    var arrow = document.createElement('span');
    if (dir === 'inbound') {
      arrow.className = 'dir-arrow in';
      arrow.textContent = '\u2192';
      arrow.title = 'inbound';
    } else if (dir === 'outbound') {
      arrow.className = 'dir-arrow out';
      arrow.textContent = '\u2190';
      arrow.title = 'outbound';
    } else {
      arrow.className = 'dir-arrow nil';
      arrow.textContent = '\u00B7';
    }
    row.appendChild(arrow);

    // timestamp
    var tsEl = document.createElement('span');
    tsEl.className = 'ts';
    tsEl.title = entry.timestamp || '';
    tsEl.textContent = relTime(entry._tsDate);
    schedRefresh(tsEl, entry._tsDate);
    row.appendChild(tsEl);

    // event type
    var evEl = document.createElement('span');
    evEl.className = 'evtype';
    evEl.textContent = entry.event_type || '(unknown)';
    row.appendChild(evEl);

    // correlation id
    if (entry.correlation_id) {
      var cidEl = document.createElement('span');
      cidEl.className = 'cid';
      cidEl.title = entry.correlation_id;
      cidEl.textContent = entry.correlation_id.slice(0, 8);
      row.appendChild(cidEl);
    }

    // expand tip
    var tip = document.createElement('span');
    tip.className = 'expand-tip';
    tip.textContent = '\u25be'; // down-pointing small triangle
    row.appendChild(tip);

    el.appendChild(row);

    // ---- expandable body ----
    var body = document.createElement('div');
    body.className = 'entry-body';

    var jb = document.createElement('div');
    jb.className = 'json-block';
    jb.innerHTML = highlight(JSON.stringify(entry.message, null, 2));
    body.appendChild(jb);

    el.appendChild(body);

    // toggle expand on row click
    row.addEventListener('click', function (e) {
      e.stopPropagation();
      var expanded = el.classList.toggle('x-expanded');
      tip.textContent = expanded ? '\u25b4' : '\u25be';
    });

    return el;
  }

  /* ===== RELATIVE TIME ===== */
  function relTime(d) {
    if (!(d instanceof Date) || isNaN(d.getTime())) return '--';
    var s = Math.floor((Date.now() - d.getTime()) / 1000);
    if (s < 5)   return 'just now';
    if (s < 60)  return s + 's ago';
    var m = Math.floor(s / 60);
    if (m < 60)  return m + 'm ago';
    var h = Math.floor(m / 60);
    if (h < 24)  return h + 'h ago';
    return Math.floor(h / 24) + 'd ago';
  }

  function schedRefresh(el, date) {
    var t = setTimeout(function tick() {
      if (!document.contains(el)) return;
      el.textContent = relTime(date);
      t = setTimeout(tick, 30000);
    }, 30000);
  }

  /* ===== JSON HIGHLIGHT ===== */
  function esc(s) {
    return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }

  function highlight(json) {
    json = esc(json);
    return json.replace(
      /("(?:\\u[0-9a-fA-F]{4}|\\[^u]|[^\\"])*"(\s*:)?|\btrue\b|\bfalse\b|\bnull\b|-?\d+(?:\.\d*)?(?:[eE][+\-]?\d+)?|[{}\[\],:])/g,
      function (tok) {
        if (/^"/.test(tok)) {
          if (/:$/.test(tok)) {
            // key (strip trailing colon, render colon separately)
            return '<span class="jk">' + tok.slice(0, -1) + '</span><span class="jp">:</span>';
          }
          return '<span class="js">' + tok + '</span>';
        }
        if (tok === 'true' || tok === 'false') return '<span class="jb">' + tok + '</span>';
        if (tok === 'null')                    return '<span class="jz">' + tok + '</span>';
        if (/[{}\[\],]/.test(tok))             return '<span class="jp">' + tok + '</span>';
        return '<span class="jn">' + tok + '</span>';
      }
    );
  }

  /* ===== FILTERING ===== */
  function entryMatches(entry) {
    if (!lvlOn[entry.level || 'info']) return false;
    if (!filterTxt) return true;
    var hay = [
      entry.event_type   || '',
      entry.level        || '',
      entry.direction    || '',
      entry.correlation_id || '',
      JSON.stringify(entry.message || {}),
    ].join(' ').toLowerCase();
    return hay.indexOf(filterTxt) !== -1;
  }

  function applyFilter(el, entry) {
    if (entryMatches(entry)) {
      el.classList.remove('hidden');
    } else {
      el.classList.add('hidden');
    }
  }

  function refilterAll() {
    for (var i = 0; i < entries.length; i++) {
      var e = entries[i];
      var el = elMap[e._id];
      if (el) applyFilter(el, e);
    }
    refreshCount();
  }

  /* ===== COUNT ===== */
  function refreshCount() {
    var total   = entries.length;
    var visible = feed.querySelectorAll('.entry:not(.hidden)').length;
    if (visible === total) {
      countLbl.textContent = total + (total === 1 ? ' entry' : ' entries');
    } else {
      countLbl.textContent = visible + ' / ' + total;
    }
  }

  /* ===== SCROLL ===== */
  function jumpToBottom() {
    feed.scrollTop = feed.scrollHeight;
    scrollFab.classList.remove('show');
  }

  function refreshFab() {
    var slack = feed.scrollHeight - feed.scrollTop - feed.clientHeight;
    if (slack > 80) {
      scrollFab.classList.add('show');
    } else {
      scrollFab.classList.remove('show');
    }
  }

  feed.addEventListener('scroll', function () {
    if (autoScroll) {
      var slack = feed.scrollHeight - feed.scrollTop - feed.clientHeight;
      if (slack > 90) {
        // User scrolled up — disengage auto-scroll
        autoScroll = false;
        autoScrollBtn.classList.remove('on');
        refreshFab();
      }
    } else {
      refreshFab();
    }
  }, { passive: true });

  scrollFab.addEventListener('click', function () {
    autoScroll = true;
    autoScrollBtn.classList.add('on');
    jumpToBottom();
  });

  /* ===== CONTROLS ===== */
  autoScrollBtn.addEventListener('click', function () {
    autoScroll = !autoScroll;
    autoScrollBtn.classList.toggle('on', autoScroll);
    if (autoScroll) jumpToBottom();
    else refreshFab();
  });

  clearBtn.addEventListener('click', function () {
    entries = [];
    elMap   = {};
    idSeq   = 0;
    pending = [];

    // Empty the feed and restore the placeholder
    while (feed.firstChild) feed.removeChild(feed.firstChild);
    feed.appendChild(emptyState);

    scrollFab.classList.remove('show');
    refreshCount();
  });

  searchInput.addEventListener('input', function () {
    filterTxt = searchInput.value.trim().toLowerCase();
    refilterAll();
  });

  lvlBtns.forEach(function (btn) {
    btn.addEventListener('click', function () {
      var lv = btn.dataset.level;
      var nextOn = !lvlOn[lv];
      // Prevent turning off the last active level
      var onCount = Object.keys(lvlOn).filter(function (k) { return lvlOn[k]; }).length;
      if (!nextOn && onCount === 1) return;
      lvlOn[lv] = nextOn;
      btn.classList.toggle('on', nextOn);
      refilterAll();
    });
  });

  /* ===== KEYBOARD ===== */
  document.addEventListener('keydown', function (e) {
    // '/' — focus filter (only when log tab active)
    if (e.key === '/' && activeTab === 'log' && document.activeElement !== searchInput) {
      e.preventDefault();
      searchInput.focus();
      searchInput.select();
      return;
    }
    // Escape — clear filter and blur (log tab)
    if (e.key === 'Escape' && document.activeElement === searchInput) {
      searchInput.value = '';
      filterTxt = '';
      refilterAll();
      searchInput.blur();
    }
    // Escape — clear tools filter
    if (e.key === 'Escape' && document.activeElement === toolsSearchInput) {
      toolsSearchInput.value = '';
      toolsFilterTxt = '';
      renderTools();
      toolsSearchInput.blur();
    }
  });

  /* ===== TAB SWITCHING ===== */
  function switchTab(tab) {
    activeTab = tab;
    var toolbar  = document.querySelector('.toolbar');
    var feedWrap = document.querySelector('.feed-wrap');

    // Reset all tabs
    tabLog.classList.remove('active');
    tabTools.classList.remove('active');
    tabAnalysis.classList.remove('active');
    toolsView.classList.remove('active');
    analysisView.classList.remove('active');
    if (toolbar)  toolbar.classList.add('view-hidden');
    if (feedWrap) feedWrap.classList.add('view-hidden');

    if (tab === 'log') {
      tabLog.classList.add('active');
      if (toolbar)  toolbar.classList.remove('view-hidden');
      if (feedWrap) feedWrap.classList.remove('view-hidden');
    } else if (tab === 'tools') {
      tabTools.classList.add('active');
      toolsView.classList.add('active');
      loadTools();
    } else {
      tabAnalysis.classList.add('active');
      analysisView.classList.add('active');
      loadAnalysis();
    }
  }

  tabLog.addEventListener('click', function () { switchTab('log'); });
  tabTools.addEventListener('click', function () { switchTab('tools'); });
  tabAnalysis.addEventListener('click', function () { switchTab('analysis'); });

  /* ===== TOOL EXPLORER ===== */

  function loadTools() {
    fetch('/api/tools')
      .then(function (res) {
        if (!res.ok) throw new Error('HTTP ' + res.status);
        return res.json();
      })
      .then(function (data) {
        allTools = (data && Array.isArray(data.tools)) ? data.tools : [];
        renderTools();
      })
      .catch(function (err) {
        renderToolsError(err.message || 'Failed to load tools');
      });
  }

  function toolMatchesFilter(tool, query) {
    if (!query) return true;
    var hay = ((tool.name || '') + ' ' + (tool.description || '') + ' ' + (tool.title || '')).toLowerCase();
    return hay.indexOf(query) !== -1;
  }

  function renderTools() {
    var query   = toolsFilterTxt;
    var matched = allTools.filter(function (t) { return toolMatchesFilter(t, query); });

    // Update count label
    if (allTools.length === 0) {
      toolsCountLbl.textContent = '';
    } else if (matched.length === allTools.length) {
      toolsCountLbl.textContent = allTools.length + (allTools.length === 1 ? ' tool' : ' tools');
    } else {
      toolsCountLbl.textContent = matched.length + ' of ' + allTools.length + ' tools';
    }

    // Clear scroll area
    while (toolsScroll.firstChild) toolsScroll.removeChild(toolsScroll.firstChild);

    if (allTools.length === 0) {
      toolsScroll.appendChild(buildToolsWaiting());
      return;
    }

    if (matched.length === 0) {
      var noMatch = document.createElement('div');
      noMatch.className = 'tools-empty';
      var nm1 = document.createElement('div');
      nm1.className = 'tools-empty-title';
      nm1.textContent = 'No matching tools';
      var nm2 = document.createElement('div');
      nm2.className = 'tools-empty-hint';
      nm2.textContent = 'Try a different search term.';
      noMatch.appendChild(nm1);
      noMatch.appendChild(nm2);
      toolsScroll.appendChild(noMatch);
      return;
    }

    var grid = document.createElement('div');
    grid.className = 'tools-grid';
    for (var i = 0; i < matched.length; i++) {
      grid.appendChild(buildToolCard(matched[i]));
    }
    toolsScroll.appendChild(grid);
  }

  function buildToolsWaiting() {
    var wrap = document.createElement('div');
    wrap.className = 'tools-empty';

    var icon = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
    icon.setAttribute('class', 'tools-empty-icon');
    icon.setAttribute('width', '46');
    icon.setAttribute('height', '46');
    icon.setAttribute('viewBox', '0 0 46 46');
    icon.setAttribute('fill', 'none');
    icon.innerHTML =
      '<rect x="6" y="6" width="34" height="34" rx="6" stroke="currentColor" stroke-width="1.5"/>' +
      '<path d="M15 23 h16 M23 15 v16" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>';
    wrap.appendChild(icon);

    var title = document.createElement('div');
    title.className = 'tools-empty-title';
    title.textContent = 'Waiting for MCP server tools...';
    wrap.appendChild(title);

    var hint = document.createElement('div');
    hint.className = 'tools-empty-hint';
    hint.textContent = 'Tools will appear once the MCP server connects and reports its capabilities.';
    wrap.appendChild(hint);

    var pulse = document.createElement('div');
    pulse.className = 'tools-pulse';
    pulse.innerHTML = '<span></span><span></span><span></span>';
    wrap.appendChild(pulse);

    return wrap;
  }

  function renderToolsError(msg) {
    while (toolsScroll.firstChild) toolsScroll.removeChild(toolsScroll.firstChild);
    toolsCountLbl.textContent = '';

    var wrap = document.createElement('div');
    wrap.className = 'tools-error';

    var icon = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
    icon.setAttribute('width', '32');
    icon.setAttribute('height', '32');
    icon.setAttribute('viewBox', '0 0 32 32');
    icon.setAttribute('fill', 'none');
    icon.style.opacity = '0.35';
    icon.style.color = 'var(--badge-error-text)';
    icon.innerHTML =
      '<circle cx="16" cy="16" r="13" stroke="currentColor" stroke-width="1.4"/>' +
      '<path d="M16 10 v7" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>' +
      '<circle cx="16" cy="21.5" r="1.1" fill="currentColor"/>';
    wrap.appendChild(icon);

    var errMsg = document.createElement('div');
    errMsg.className = 'tools-error-msg';
    errMsg.textContent = 'Could not load tools: ' + msg;
    wrap.appendChild(errMsg);

    toolsScroll.appendChild(wrap);
  }

  function buildToolCard(tool) {
    var card = document.createElement('div');
    card.className = 'tool-card';

    // --- Header row ---
    var header = document.createElement('div');
    header.className = 'tool-card-header';

    var nameEl = document.createElement('span');
    nameEl.className = 'tool-card-name';
    nameEl.textContent = tool.name || '(unnamed)';
    header.appendChild(nameEl);

    if (tool.title) {
      var titleEl = document.createElement('span');
      titleEl.className = 'tool-card-title';
      titleEl.textContent = tool.title;
      header.appendChild(titleEl);
    }

    // Annotation badges
    var ann = tool.annotations;
    if (ann) {
      var badgesEl = document.createElement('div');
      badgesEl.className = 'tool-card-badges';

      if (ann.readOnlyHint === true) {
        badgesEl.appendChild(makeBadge('read-only', 'readonly'));
      }
      if (ann.destructiveHint === true) {
        badgesEl.appendChild(makeBadge('destructive', 'destructive'));
      }
      if (ann.idempotentHint === true) {
        badgesEl.appendChild(makeBadge('idempotent', 'idempotent'));
      }
      if (ann.openWorldHint === true) {
        badgesEl.appendChild(makeBadge('open-world', 'openworld'));
      }

      if (badgesEl.childNodes.length > 0) {
        header.appendChild(badgesEl);
      }
    }

    card.appendChild(header);

    // --- Description ---
    if (tool.description) {
      var descEl = document.createElement('div');
      descEl.className = 'tool-card-desc';
      descEl.textContent = tool.description;
      card.appendChild(descEl);
    }

    // --- Input Schema ---
    if (tool.input_schema) {
      card.appendChild(buildSchemaSection('Input Schema', tool.input_schema));
    }

    // --- Output Schema ---
    if (tool.output_schema) {
      card.appendChild(buildSchemaSection('Output Schema', tool.output_schema));
    }

    return card;
  }

  function makeBadge(label, cls) {
    var b = document.createElement('span');
    b.className = 'ann-badge ' + cls;
    b.textContent = label;
    return b;
  }

  function buildSchemaSection(label, schema) {
    var section = document.createElement('div');
    section.className = 'schema-section';

    var toggle = document.createElement('button');
    toggle.className = 'schema-toggle';
    toggle.type = 'button';

    var arrow = document.createElement('span');
    arrow.className = 'schema-arrow';
    arrow.textContent = '\u25b6'; // right-pointing triangle

    toggle.appendChild(arrow);
    toggle.appendChild(document.createTextNode(' ' + label));

    var body = document.createElement('div');
    body.className = 'schema-body';

    var jb = document.createElement('div');
    jb.className = 'json-block';
    var schemaJson;
    try {
      schemaJson = JSON.stringify(schema, null, 2);
    } catch (_) {
      schemaJson = String(schema);
    }
    jb.innerHTML = highlight(schemaJson);
    body.appendChild(jb);

    toggle.addEventListener('click', function () {
      var isOpen = body.classList.toggle('open');
      toggle.classList.toggle('open', isOpen);
    });

    section.appendChild(toggle);
    section.appendChild(body);
    return section;
  }

  /* ===== ANALYSIS ===== */

  function stopAnalysisPoll() {
    if (analysisPollTimer) { clearInterval(analysisPollTimer); analysisPollTimer = null; }
  }

  function startAnalysisPoll() {
    stopAnalysisPoll();
    analysisPollTimer = setInterval(function () { loadAnalysis(true); }, 2000);
  }

  function loadAnalysis(silent) {
    fetch('/api/analysis')
      .then(function (res) { return res.json(); })
      .then(function (report) {
        currentReport = report;
        if (report.status !== 'running') { stopAnalysisPoll(); }
        renderAnalysis(report);
      })
      .catch(function (err) {
        stopAnalysisPoll();
        if (!silent) renderAnalysisState('error', 'Could not reach analysis endpoint: ' + err.message);
      });
  }

  function renderAnalysis(report) {
    var s = report.status;
    analysisStatusText.textContent = statusLabel(report);
    saveReportBtn.disabled = (s !== 'complete');
    runAnalysisBtn.disabled = (s === 'running');

    while (analysisScroll.firstChild) analysisScroll.removeChild(analysisScroll.firstChild);

    if (s === 'unconfigured') {
      analysisScroll.appendChild(buildUnconfiguredState());
    } else if (s === 'pending') {
      analysisScroll.appendChild(buildPendingState());
    } else if (s === 'running') {
      analysisScroll.appendChild(buildRunningState());
    } else if (s === 'insufficient_data') {
      renderAnalysisState('info', report.message || 'Not enough data yet. Let the MCP server receive some traffic first.');
    } else if (s === 'error') {
      renderAnalysisState('error', report.message || 'Analysis failed.');
    } else if (s === 'complete') {
      analysisScroll.appendChild(buildReport(report));
    }
  }

  function statusLabel(report) {
    var s = report.status;
    if (s === 'running')  return 'Analysis in progress…';
    if (s === 'pending')  return 'Ready — click Run Analysis to start.';
    if (s === 'unconfigured') return 'Set ANTHROPIC_API_KEY to enable.';
    if (s === 'error')    return 'Last run failed.';
    if (s === 'complete' && report.analyzed_at) {
      return 'Last analyzed ' + relTime(new Date(report.analyzed_at));
    }
    return '';
  }

  function renderAnalysisState(type, msg) {
    while (analysisScroll.firstChild) analysisScroll.removeChild(analysisScroll.firstChild);
    var wrap = document.createElement('div');
    wrap.className = 'an-center';
    if (type === 'error') {
      var card = document.createElement('div');
      card.className = 'an-error-card an-center';
      var t = document.createElement('div'); t.className = 'an-center-title'; t.textContent = 'Error'; card.appendChild(t);
      var b = document.createElement('div'); b.className = 'an-center-body'; b.textContent = msg; card.appendChild(b);
      var retry = document.createElement('button'); retry.className = 'btn-run-analysis'; retry.textContent = 'Try Again';
      retry.addEventListener('click', triggerAnalysis); card.appendChild(retry);
      analysisScroll.appendChild(card);
    } else {
      var b2 = document.createElement('div'); b2.className = 'an-center-body'; b2.textContent = msg;
      wrap.appendChild(b2); analysisScroll.appendChild(wrap);
    }
  }

  function buildUnconfiguredState() {
    var wrap = document.createElement('div'); wrap.className = 'an-center';
    var icon = document.createElement('div'); icon.className = 'an-center-icon';
    icon.innerHTML = '<svg width="40" height="40" viewBox="0 0 40 40" fill="none"><circle cx="20" cy="20" r="17" stroke="currentColor" stroke-width="1.5"/><path d="M14 18 a6 6 0 0 1 12 0 v2 H14 Z" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"/><rect x="12" y="20" width="16" height="10" rx="2" stroke="currentColor" stroke-width="1.3"/><circle cx="20" cy="25" r="1.5" fill="currentColor"/></svg>';
    var t = document.createElement('div'); t.className = 'an-center-title'; t.textContent = 'AI Analysis Unavailable';
    var b = document.createElement('div'); b.className = 'an-center-body';
    b.textContent = 'Set the ANTHROPIC_API_KEY environment variable and restart feedbackloop to enable AI-powered tool analysis.';
    var code = document.createElement('div'); code.className = 'an-code-hint'; code.textContent = 'export ANTHROPIC_API_KEY=sk-ant-...';
    wrap.appendChild(icon); wrap.appendChild(t); wrap.appendChild(b); wrap.appendChild(code);
    return wrap;
  }

  function buildPendingState() {
    var wrap = document.createElement('div'); wrap.className = 'an-center';
    var icon = document.createElement('div'); icon.className = 'an-center-icon';
    icon.innerHTML = '<svg width="40" height="40" viewBox="0 0 40 40" fill="none"><circle cx="20" cy="20" r="17" stroke="currentColor" stroke-width="1.5"/><path d="M13 20 l4 4 l10-10" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>';
    var t = document.createElement('div'); t.className = 'an-center-title'; t.textContent = 'Ready to Analyze';
    var b = document.createElement('div'); b.className = 'an-center-body';
    b.textContent = 'Click Run Analysis to have Claude analyze your tool catalog and usage patterns for optimization opportunities.';
    wrap.appendChild(icon); wrap.appendChild(t); wrap.appendChild(b);
    return wrap;
  }

  function buildRunningState() {
    var wrap = document.createElement('div'); wrap.className = 'an-center';
    var spinner = document.createElement('div'); spinner.className = 'an-spinner';
    var t = document.createElement('div'); t.className = 'an-center-title'; t.textContent = 'Claude is analyzing your tools…';
    var b = document.createElement('div'); b.className = 'an-center-body'; b.textContent = 'This usually takes 15–30 seconds.';
    wrap.appendChild(spinner); wrap.appendChild(t); wrap.appendChild(b);
    return wrap;
  }

  function buildReport(report) {
    var recs = report.recommendations || [];
    var wrap = document.createElement('div'); wrap.className = 'an-report';

    // Stats row
    var statsRow = document.createElement('div'); statsRow.className = 'an-stats-row';
    [
      [report.tool_count, 'Tools Analyzed'],
      [report.call_count, 'Tool Calls Observed'],
      [report.error_count, 'Errors'],
      [recs.length, 'Recommendations'],
    ].forEach(function (pair) {
      var card = document.createElement('div'); card.className = 'an-stat-card';
      var num = document.createElement('div'); num.className = 'an-stat-num'; num.textContent = pair[0] || 0;
      var lbl = document.createElement('div'); lbl.className = 'an-stat-lbl'; lbl.textContent = pair[1];
      card.appendChild(num); card.appendChild(lbl); statsRow.appendChild(card);
    });
    wrap.appendChild(statsRow);

    // Summary card
    var sumCard = document.createElement('div'); sumCard.className = 'an-summary-card';
    var sumLbl = document.createElement('div'); sumLbl.className = 'an-summary-label'; sumLbl.textContent = 'Executive Summary';
    var sumText = document.createElement('div'); sumText.className = 'an-summary-text'; sumText.textContent = report.summary || '';
    var sumMeta = document.createElement('div'); sumMeta.className = 'an-summary-meta';
    sumMeta.textContent = 'Analyzed by ' + (report.model || 'Claude') +
      (report.analyzed_at ? ' · ' + new Date(report.analyzed_at).toLocaleString() : '');
    sumCard.appendChild(sumLbl); sumCard.appendChild(sumText); sumCard.appendChild(sumMeta);
    wrap.appendChild(sumCard);

    // Recommendations section
    var recsWrap = document.createElement('div');
    var recsHdr = document.createElement('div'); recsHdr.className = 'an-recs-header';
    var recsTitle = document.createElement('div'); recsTitle.className = 'an-recs-title'; recsTitle.textContent = 'Recommendations';
    var recsBadge = document.createElement('div'); recsBadge.className = 'an-recs-badge'; recsBadge.textContent = recs.length;
    recsHdr.appendChild(recsTitle); recsHdr.appendChild(recsBadge); recsWrap.appendChild(recsHdr);

    // Filters
    var filterRow = document.createElement('div'); filterRow.className = 'an-filters';
    var cats = ['all', 'description', 'parameter', 'new_tool', 'performance', 'error_pattern'];
    var catLabels = {all:'All', description:'Description', parameter:'Parameter', new_tool:'New Tool', performance:'Performance', error_pattern:'Error Pattern'};
    cats.forEach(function (c) {
      var chip = document.createElement('button'); chip.className = 'an-filter-chip' + (anCatFilter===c?' on':'');
      chip.textContent = catLabels[c]; chip.dataset.cat = c;
      chip.addEventListener('click', function () {
        anCatFilter = c; filterRow.querySelectorAll('.an-filter-chip').forEach(function(x){x.classList.remove('on');});
        chip.classList.add('on'); renderRecCards(recsContainer, recs);
      });
      filterRow.appendChild(chip);
    });
    var sep = document.createElement('div'); sep.className = 'an-filter-sep'; filterRow.appendChild(sep);
    var pris = ['all','high','medium','low'];
    pris.forEach(function (p) {
      var chip = document.createElement('button'); chip.className = 'an-filter-chip' + (anPriFilter===p?' on':'');
      chip.textContent = p==='all'?'All Priority':p.charAt(0).toUpperCase()+p.slice(1); chip.dataset.pri = p;
      chip.addEventListener('click', function () {
        anPriFilter = p; filterRow.querySelectorAll('[data-pri]').forEach(function(x){x.classList.remove('on');});
        chip.classList.add('on'); renderRecCards(recsContainer, recs);
      });
      filterRow.appendChild(chip);
    });
    recsWrap.appendChild(filterRow);

    var recsContainer = document.createElement('div'); recsContainer.className = 'an-recs-list';
    renderRecCards(recsContainer, recs);
    recsWrap.appendChild(recsContainer);
    wrap.appendChild(recsWrap);
    return wrap;
  }

  function renderRecCards(container, recs) {
    while (container.firstChild) container.removeChild(container.firstChild);
    var filtered = recs.filter(function (r) {
      if (anCatFilter !== 'all' && r.category !== anCatFilter) return false;
      if (anPriFilter !== 'all' && r.priority !== anPriFilter) return false;
      return true;
    });
    if (filtered.length === 0) {
      var none = document.createElement('div'); none.className = 'an-center-body';
      none.style.padding = '40px 0'; none.textContent = 'No recommendations match the current filters.';
      container.appendChild(none); return;
    }
    filtered.forEach(function (rec) { container.appendChild(buildRecCard(rec)); });
  }

  function buildRecCard(rec) {
    var card = document.createElement('div');
    card.className = 'rec-card pri-' + (rec.priority || 'low');

    // Header
    var hdr = document.createElement('div'); hdr.className = 'rec-header';
    var priB = document.createElement('span'); priB.className = 'rec-priority ' + (rec.priority || 'low');
    priB.textContent = (rec.priority || 'low').toUpperCase(); hdr.appendChild(priB);
    var catB = document.createElement('span'); catB.className = 'rec-category cat-' + (rec.category || '');
    catB.textContent = (rec.category || '').replace(/_/g, ' '); hdr.appendChild(catB);
    if (rec.tool_name) {
      var tn = document.createElement('span'); tn.className = 'rec-tool-name'; tn.textContent = rec.tool_name; hdr.appendChild(tn);
    }
    var arrow = document.createElement('span'); arrow.className = 'rec-expand-arrow'; arrow.textContent = '▶'; hdr.appendChild(arrow);
    card.appendChild(hdr);

    // Title
    var title = document.createElement('div'); title.className = 'rec-title'; title.textContent = rec.title || ''; card.appendChild(title);

    // Body (hidden until expanded)
    var body = document.createElement('div'); body.className = 'rec-body';

    function addSection(label, content) {
      if (!content || (Array.isArray(content) && content.length === 0)) return;
      var sec = document.createElement('div'); sec.className = 'rec-section';
      var lbl = document.createElement('div'); lbl.className = 'rec-section-label'; lbl.textContent = label; sec.appendChild(lbl);
      if (Array.isArray(content)) {
        var ul = document.createElement('ul'); ul.className = 'rec-evidence-list';
        content.forEach(function (e) { var li = document.createElement('li'); li.textContent = e; ul.appendChild(li); });
        sec.appendChild(ul);
      } else {
        var p = document.createElement('div'); p.className = 'rec-section-text'; p.textContent = content; sec.appendChild(p);
      }
      body.appendChild(sec);
    }

    addSection('Problem', rec.problem);
    addSection('Suggestion', rec.suggestion);
    addSection('Evidence', rec.evidence);

    // Before / After diff
    if (rec.original_text || rec.improved_text) {
      var diffSec = document.createElement('div'); diffSec.className = 'rec-section';
      var diffLbl = document.createElement('div'); diffLbl.className = 'rec-section-label'; diffLbl.textContent = 'Before / After'; diffSec.appendChild(diffLbl);
      var diffGrid = document.createElement('div'); diffGrid.className = 'rec-diff';
      if (rec.original_text) {
        var bc = document.createElement('div'); bc.className = 'rec-diff-col rec-diff-before';
        var bl = document.createElement('div'); bl.className = 'rec-diff-label'; bl.textContent = 'Before'; bc.appendChild(bl);
        var bt = document.createElement('div'); bt.className = 'rec-diff-text'; bt.textContent = rec.original_text; bc.appendChild(bt);
        diffGrid.appendChild(bc);
      }
      if (rec.improved_text) {
        var ac = document.createElement('div'); ac.className = 'rec-diff-col rec-diff-after';
        var al = document.createElement('div'); al.className = 'rec-diff-label'; al.textContent = 'After'; ac.appendChild(al);
        var at = document.createElement('div'); at.className = 'rec-diff-text'; at.textContent = rec.improved_text; ac.appendChild(at);
        diffGrid.appendChild(ac);
      }
      diffSec.appendChild(diffGrid); body.appendChild(diffSec);
    }

    card.appendChild(body);

    card.addEventListener('click', function () {
      card.classList.toggle('expanded');
    });

    return card;
  }

  function triggerAnalysis() {
    runAnalysisBtn.disabled = true;
    fetch('/api/analyze', { method: 'POST' })
      .then(function (res) {
        if (res.status === 503) { loadAnalysis(); return; }
        if (res.status === 409) { loadAnalysis(); return; }
        currentReport = { status: 'running' };
        renderAnalysis(currentReport);
        startAnalysisPoll();
      })
      .catch(function (err) {
        runAnalysisBtn.disabled = false;
        renderAnalysisState('error', 'Failed to start analysis: ' + err.message);
      });
  }

  function buildSavedReport(report) {
    var recs = report.recommendations || [];
    var date = report.analyzed_at ? new Date(report.analyzed_at).toLocaleString() : '';
    var recsHtml = recs.map(function (rec) {
      var evidence = (rec.evidence || []).map(function(e){return '<li>'+esc(e)+'</li>';}).join('');
      var diff = '';
      if (rec.original_text || rec.improved_text) {
        diff = '<div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px">' +
          (rec.original_text ? '<div><div style="font-size:10px;font-weight:700;color:#d95555;margin-bottom:6px;text-transform:uppercase">Before</div><pre style="background:#1e0a0a;color:#d9a0a0;border:1px solid #3d1515;border-radius:6px;padding:10px 12px;white-space:pre-wrap;word-break:break-word;font-size:11px;line-height:1.6">'+esc(rec.original_text)+'</pre></div>':'') +
          (rec.improved_text ? '<div><div style="font-size:10px;font-weight:700;color:#3daa6a;margin-bottom:6px;text-transform:uppercase">After</div><pre style="background:#091811;color:#7ec8a0;border:1px solid #0d2e1a;border-radius:6px;padding:10px 12px;white-space:pre-wrap;word-break:break-word;font-size:11px;line-height:1.6">'+esc(rec.improved_text)+'</pre></div>':'') +
          '</div>';
      }
      var priColor = {high:'#c0392b',medium:'#d4871a',low:'#3d68a8'}[rec.priority]||'#3d68a8';
      return '<div style="border:1px solid #252b3a;border-left:4px solid '+priColor+';border-radius:8px;padding:18px 20px;margin-bottom:12px;background:#111418">' +
        '<div style="display:flex;gap:8px;align-items:center;margin-bottom:10px">' +
        '<span style="font-size:10px;font-weight:700;text-transform:uppercase;padding:2px 7px;border-radius:3px;background:#1c2029;color:'+priColor+'">'+(rec.priority||'').toUpperCase()+'</span>' +
        '<span style="font-size:10px;font-weight:600;text-transform:uppercase;padding:2px 7px;border-radius:3px;background:#1c2029;color:#7e8aa3">'+(rec.category||'').replace(/_/g,' ')+'</span>' +
        (rec.tool_name?'<span style="font-family:monospace;font-size:11px;color:#3f4a62">'+esc(rec.tool_name)+'</span>':'') +
        '</div>' +
        '<div style="font-size:14px;font-weight:600;color:#dde2ef;margin-bottom:12px">'+esc(rec.title||'')+'</div>' +
        (rec.problem?'<div style="margin-bottom:10px"><div style="font-size:10px;font-weight:700;text-transform:uppercase;color:#3f4a62;margin-bottom:4px">Problem</div><div style="font-size:13px;color:#7e8aa3;line-height:1.6">'+esc(rec.problem)+'</div></div>':'') +
        (rec.suggestion?'<div style="margin-bottom:10px"><div style="font-size:10px;font-weight:700;text-transform:uppercase;color:#3f4a62;margin-bottom:4px">Suggestion</div><div style="font-size:13px;color:#7e8aa3;line-height:1.6">'+esc(rec.suggestion)+'</div></div>':'') +
        (evidence?'<div style="margin-bottom:10px"><div style="font-size:10px;font-weight:700;text-transform:uppercase;color:#3f4a62;margin-bottom:4px">Evidence</div><ul style="list-style:none;padding:0">'+evidence+'</ul></div>':'') +
        diff + '</div>';
    }).join('');

    return '<!DOCTYPE html><html><head><meta charset="UTF-8"><title>feedbackloop Analysis Report</title>' +
      '<style>*{box-sizing:border-box;margin:0;padding:0}body{background:#0d0f12;color:#dde2ef;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;font-size:13px;padding:32px}' +
      '.report{max-width:900px;margin:0 auto}.header{margin-bottom:28px}.title{font-size:22px;font-weight:700;color:#dde2ef}.sub{font-size:12px;color:#3f4a62;font-family:monospace;margin-top:6px}' +
      '.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:24px}.stat{background:#111418;border:1px solid #252b3a;border-radius:8px;padding:16px 18px}.stat-num{font-family:monospace;font-size:24px;font-weight:600;color:#dde2ef}.stat-lbl{font-size:11px;color:#7e8aa3;text-transform:uppercase;letter-spacing:.04em;margin-top:5px}' +
      '.summary{background:#111418;border:1px solid #252b3a;border-radius:8px;padding:20px 24px;margin-bottom:24px}.summary-lbl{font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:#3f4a62;margin-bottom:10px}.summary-text{font-size:14px;line-height:1.7;color:#dde2ef}.summary-meta{font-size:11px;color:#3f4a62;font-family:monospace;margin-top:12px}' +
      'li::before{content:"→ ";color:#3f4a62}' +
      '</style></head><body><div class="report">' +
      '<div class="header"><div class="title">feedbackloop — AI Analysis Report</div><div class="sub">Analyzed by '+(report.model||'Claude')+' · '+date+'</div></div>' +
      '<div class="stats">' +
      '<div class="stat"><div class="stat-num">'+(report.tool_count||0)+'</div><div class="stat-lbl">Tools Analyzed</div></div>' +
      '<div class="stat"><div class="stat-num">'+(report.call_count||0)+'</div><div class="stat-lbl">Tool Calls</div></div>' +
      '<div class="stat"><div class="stat-num">'+(report.error_count||0)+'</div><div class="stat-lbl">Errors</div></div>' +
      '<div class="stat"><div class="stat-num">'+recs.length+'</div><div class="stat-lbl">Recommendations</div></div>' +
      '</div>' +
      '<div class="summary"><div class="summary-lbl">Executive Summary</div><div class="summary-text">'+esc(report.summary||'')+'</div><div class="summary-meta">'+date+'</div></div>' +
      '<div style="font-size:15px;font-weight:600;color:#dde2ef;margin-bottom:14px">Recommendations ('+recs.length+')</div>' +
      recsHtml +
      '</div></body></html>';
  }

  function esc(str) {
    return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  runAnalysisBtn.addEventListener('click', triggerAnalysis);

  saveReportBtn.addEventListener('click', function () {
    if (!currentReport || currentReport.status !== 'complete') return;
    var html = buildSavedReport(currentReport);
    var blob = new Blob([html], { type: 'text/html' });
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url; a.download = 'feedbackloop-analysis-' + new Date().toISOString().slice(0,10) + '.html';
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(function () { URL.revokeObjectURL(url); }, 5000);
  });

  /* ===== TOOLS SEARCH ===== */
  toolsSearchInput.addEventListener('input', function () {
    toolsFilterTxt = toolsSearchInput.value.trim().toLowerCase();
    renderTools();
  });

  /* ===== BOOT ===== */
  refreshCount();
  connect();
  loadTools();    // pre-fetch tools on initial load
  loadAnalysis(); // pre-fetch analysis state on initial load

}());
</script>
</body>
</html>
